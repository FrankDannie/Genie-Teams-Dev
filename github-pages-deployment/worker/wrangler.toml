name = "genie-connect-proxy"
main = "worker.js"
compatibility_date = "2024-11-01"

# Non-secret defaults (safe to keep here / commit).
# Set ALLOWED_ORIGIN to your exact GitHub Pages origin once you know it,
# e.g. "https://yourname.github.io" — avoid leaving this as "*" once the
# worker is live, so only your page can call it.
[vars]
ALLOWED_ORIGIN = "*"
GENIE_ID = "gin-AbMAK4r6-rXgonW-CD"
DATA_CENTER = "www.workato.com"

# Secrets are NOT set here. After `wrangler login`, run:
#   wrangler secret put GENIE_API_KEY
#   wrangler secret put IAM_API_TOKEN
# (you'll be prompted to paste each value; they're encrypted at rest and
# never appear in this file, in git, or in the dashboard's plain view)
